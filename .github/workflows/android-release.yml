name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses

      - name: Install Android 36 SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tvi-release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tvi-release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No complete release keystore secret set was found; build will be unsigned."
          fi

      - name: Assemble release APK
        working-directory: android
        env:
          TVI_API_BASE_URL: ${{ vars.TVI_API_BASE_URL }}
          TVI_API_TOKEN: ${{ secrets.TVI_API_TOKEN }}
        run: |
          if [[ -z "$TVI_API_BASE_URL" || -z "$TVI_API_TOKEN" ]]; then
            echo "::error::Configure the TVI_API_BASE_URL repository variable and TVI_API_TOKEN repository secret before publishing a usable production APK."
            exit 1
          fi
          gradle --no-daemon :app:assembleRelease

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tennis-video-intelligence-v0.5.0-release-signed
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tennis-video-intelligence-v0.5.0-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.signing.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v0.5.0
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving the published release unchanged."
            exit 0
          fi
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          gh release create "$VERSION" "$APK" \
            --title "Tennis Video Intelligence $VERSION" \
            --notes "Signed Android release. Includes Android-managed background uploads with progress and resume (up to 5 GB), HTTPS-only networking, auto-configured hosted backend and the Liquid Glass-inspired interface. Android 14+ uses user-initiated data-transfer jobs; earlier versions use WorkManager. Backend computer-vision detections remain review candidates and require human confirmation." \
            --target "$GITHUB_SHA" \
            --latest
