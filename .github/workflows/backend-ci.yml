name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test
        run: pytest
      - name: Build and smoke-test backend container
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker build -t tennis-video-intelligence-api:ci .
          DATA_DIR="$(mktemp -d)"
          CONTAINER_NAME="tvi-backend-ci"
          cleanup() {
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            sudo rm -rf "$DATA_DIR"
          }
          trap cleanup EXIT
          docker run -d --name "$CONTAINER_NAME" \
            -e TVI_API_TOKEN=ci-smoke-test-token \
            -e TVI_ENVIRONMENT=production \
            -e PORT=18000 \
            -p 18000:18000 \
            -v "$DATA_DIR:/data" \
            tennis-video-intelligence-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              echo "Backend container health check passed."
              exit 0
            fi
            sleep 2
          done
          docker logs "$CONTAINER_NAME"
          echo "Backend container did not become healthy." >&2
          exit 1
